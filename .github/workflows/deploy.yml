# Baut einmal (Typecheck, Tests, Image) und rollt prod aus.
# Schutz: In GitHub unter Settings > Environments > prod „Required reviewers“ setzen (bei öffentlichen Repos verfügbar),
# dann wartet das Ausrollen auf Freigabe.
name: Build und Ausrollen

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build und Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cash-und-raus:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cash-und-raus:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  prod:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: prod
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
